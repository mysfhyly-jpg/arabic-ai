<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد عربي — AI احترافي</title>
<meta name="description" content="مساعد ذكاء اصطناعي عربي احترافي.">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Cairo', sans-serif; }
  body { background: #0a0a0a; }
  
  .chat-bg {
    background: linear-gradient(180deg, #0a0a0a 0%, #0f0f0f 100%);
  }
  
  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  
  .avatar-user {
    background: linear-gradient(135deg, #dc2626, #991b1b);
    color: white;
  }
  
  .avatar-ai {
    background: linear-gradient(135deg, #1f2937, #111827);
    border: 1px solid #374151;
  }
  
  .msg-bubble-user {
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    color: white;
    border-radius: 16px 16px 4px 16px;
    padding: 10px 14px;
    max-width: 100%;
    word-wrap: break-word;
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 15px;
  }
  
  .msg-bubble-ai {
    background: #171717;
    border: 1px solid #262626;
    color: #e5e7eb;
    border-radius: 16px 16px 16px 4px;
    padding: 12px 16px;
    max-width: 100%;
    word-wrap: break-word;
    line-height: 1.8;
    font-size: 15px;
  }
  
  .msg-bubble-ai p { margin: 0 0 8px 0; }
  .msg-bubble-ai p:last-child { margin-bottom: 0; }
  .msg-bubble-ai strong { color: #f87171; font-weight: 700; }
  .msg-bubble-ai em { color: #fbbf24; font-style: italic; }
  .msg-bubble-ai ul, .msg-bubble-ai ol { padding-right: 20px; margin: 8px 0; }
  .msg-bubble-ai li { margin-bottom: 4px; }
  .msg-bubble-ai h1, .msg-bubble-ai h2, .msg-bubble-ai h3 { color: #f87171; font-weight: 700; margin: 12px 0 8px; }
  .msg-bubble-ai h1 { font-size: 20px; }
  .msg-bubble-ai h2 { font-size: 18px; }
  .msg-bubble-ai h3 { font-size: 16px; }
  .msg-bubble-ai code {
    background: #0a0a0a;
    color: #f87171;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    direction: ltr;
    display: inline-block;
  }
  .msg-bubble-ai pre {
    background: #0a0a0a;
    border: 1px solid #262626;
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    direction: ltr;
    text-align: left;
    margin: 8px 0;
  }
  .msg-bubble-ai pre code {
    background: transparent;
    color: #e5e7eb;
    padding: 0;
    font-size: 13px;
  }
  .msg-bubble-ai a { color: #60a5fa; text-decoration: underline; }
  .msg-bubble-ai blockquote {
    border-right: 3px solid #dc2626;
    padding-right: 12px;
    margin: 8px 0;
    color: #9ca3af;
    font-style: italic;
  }
  .msg-bubble-ai hr {
    border: none;
    border-top: 1px solid #262626;
    margin: 12px 0;
  }
  
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeInUp 0.3s ease-out; }
  
  .typing-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
  }
  .typing-indicator span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6b7280;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }
  
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #404040; }
  
  textarea { resize: none; max-height: 160px; }
  
  .copy-btn {
    opacity: 0;
    transition: opacity 0.2s;
  }
  .msg-row:hover .copy-btn {
    opacity: 1;
  }
  
  .timestamp {
    font-size: 11px;
    color: #6b7280;
    margin-top: 4px;
  }
</style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col chat-bg">

<!-- Header -->
<header class="border-b border-gray-900 bg-black/40 backdrop-blur-md sticky top-0 z-50">
  <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-red-600 to-red-800 flex items-center justify-center text-lg">
        🤖
      </div>
      <div>
        <h1 class="text-base font-bold text-white leading-tight">مساعد عربي</h1>
        <p class="text-[11px] text-gray-500">AI احترافي بالعربية</p>
      </div>
    </div>
    <button onclick="clearChat()" class="text-xs bg-gray-900 hover:bg-gray-800 border border-gray-800 text-gray-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      محادثة جديدة
    </button>
  </div>
</header>

<!-- Main -->
<main class="flex-grow overflow-hidden">
  <div class="max-w-3xl mx-auto h-full flex flex-col px-3 sm:px-4">
    
    <div id="chat-container" class="flex-grow overflow-y-auto py-6 space-y-6">
      
      <!-- Welcome Screen -->
      <div id="welcome" class="text-center py-16 px-4">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-red-600 to-red-800 flex items-center justify-center text-3xl mx-auto mb-5 shadow-lg shadow-red-900/50">
          🤖
        </div>
        <h2 class="text-2xl font-bold text-white mb-2">مرحباً بك</h2>
        <p class="text-gray-500 text-sm mb-8">كيف يمكنني مساعدتك اليوم؟</p>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-xl mx-auto">
          <button onclick="useSuggestion('اكتب لي رسالة شكر لمديري')" class="text-right bg-gray-900/50 hover:bg-gray-900 border border-gray-800 hover:border-red-600/50 rounded-xl p-4 transition text-sm text-gray-300 flex items-start gap-3">
            <span class="text-lg">✍️</span>
            <div>
              <div class="font-semibold text-white mb-0.5">اكتب رسالة</div>
              <div class="text-xs text-gray-500">رسالة شكر لمديري</div>
            </div>
          </button>
          <button onclick="useSuggestion('اشرح لي نظرية النسبية بأسلوب بسيط')" class="text-right bg-gray-900/50 hover:bg-gray-900 border border-gray-800 hover:border-red-600/50 rounded-xl p-4 transition text-sm text-gray-300 flex items-start gap-3">
            <span class="text-lg">🧠</span>
            <div>
              <div class="font-semibold text-white mb-0.5">اشرح مفهوماً</div>
              <div class="text-xs text-gray-500">بأسلوب بسيط وواضح</div>
            </div>
          </button>
          <button onclick="useSuggestion('لخص لي هذا النص: ') " class="text-right bg-gray-900/50 hover:bg-gray-900 border border-gray-800 hover:border-red-600/50 rounded-xl p-4 transition text-sm text-gray-300 flex items-start gap-3">
            <span class="text-lg">📝</span>
            <div>
              <div class="font-semibold text-white mb-0.5">لخص نصاً</div>
              <div class="text-xs text-gray-500">طويلاً أو معقداً</div>
            </div>
          </button>
          <button onclick="useSuggestion('صحح الأخطاء الإملائية في هذا النص: ') " class="text-right bg-gray-900/50 hover:bg-gray-900 border border-gray-800 hover:border-red-600/50 rounded-xl p-4 transition text-sm text-gray-300 flex items-start gap-3">
            <span class="text-lg">✏️</span>
            <div>
              <div class="font-semibold text-white mb-0.5">صحح نصاً</div>
              <div class="text-xs text-gray-500">إملائياً ونحوياً</div>
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="py-4 border-t border-gray-900">
      <div class="flex items-end gap-2 bg-gray-900/60 border border-gray-800 rounded-2xl p-2 focus-within:border-red-600/50 transition">
        <textarea 
          id="user-input" 
          rows="1"
          placeholder="اكتب رسالتك هنا..." 
          class="flex-grow bg-transparent text-white text-[15px] p-2.5 focus:outline-none placeholder-gray-600 min-h-[40px]"
          onkeydown="handleKeyDown(event)"
          oninput="autoResize(this)"></textarea>
        <button 
          id="send-btn"
          onclick="sendMessage()" 
          disabled
          class="bg-red-600 hover:bg-red-500 disabled:bg-gray-800 disabled:text-gray-600 disabled:cursor-not-allowed text-white rounded-xl p-2.5 transition flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <p class="text-[10px] text-gray-600 text-center mt-2">مساعد عربي • AI احترافي</p>
    </div>
  </div>
</main>

<script>
const WORKER_URL = 'https://worker-abc123.mysfhyly.workers.dev';
const MODEL = 'openai/gpt-oss-120b';
const STORAGE_KEY = 'arabic_ai_conversation';

let conversationHistory = [];

// ===== تحميل المحادثة المحفوظة =====
function loadConversation() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const data = JSON.parse(saved);
      conversationHistory = data.history || [];
      if (conversationHistory.length > 0) {
        const welcome = document.getElementById('welcome');
        if (welcome) welcome.remove();
        conversationHistory.forEach(msg => {
          addMessageToUI(msg.content, msg.role === 'user', false);
        });
      }
    } catch (e) {
      console.error('Failed to load conversation:', e);
    }
  }
}

function saveConversation() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      history: conversationHistory,
      timestamp: Date.now()
    }));
  } catch (e) {
    console.error('Failed to save conversation:', e);
  }
}

// ===== Auto Resize =====
function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
  document.getElementById('send-btn').disabled = !textarea.value.trim();
}

// ===== Keyboard =====
function handleKeyDown(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

// ===== Suggestion =====
function useSuggestion(text) {
  const input = document.getElementById('user-input');
  input.value = text;
  input.focus();
  autoResize(input);
}

// ===== Clear Chat =====
function clearChat() {
  if (confirm('هل تريد بدء محادثة جديدة؟ سيتم حذف المحادثة الحالية.')) {
    conversationHistory = [];
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

// ===== Time Format =====
function getTime() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  return `${hours}:${minutes}`;
}

// ===== Add Message to UI =====
function addMessageToUI(text, isUser, animate = true) {
  const container = document.getElementById('chat-container');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  
  const wrapper = document.createElement('div');
  wrapper.className = `msg-row flex gap-3 ${isUser ? 'flex-row-reverse' : ''} ${animate ? 'fade-in' : ''}`;
  
  const avatar = document.createElement('div');
  avatar.className = `msg-avatar ${isUser ? 'avatar-user' : 'avatar-ai'}`;
  avatar.textContent = isUser ? '👤' : '🤖';
  
  const contentWrapper = document.createElement('div');
  contentWrapper.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} flex-1 min-w-0`;
  
  const bubble = document.createElement('div');
  bubble.className = isUser ? 'msg-bubble-user' : 'msg-bubble-ai';
  
  if (isUser) {
    bubble.textContent = text;
  } else {
    bubble.innerHTML = marked.parse(text);
  }
  
  const meta = document.createElement('div');
  meta.className = `flex items-center gap-2 ${isUser ? 'flex-row-reverse' : ''}`;
  
  const time = document.createElement('span');
  time.className = 'timestamp';
  time.textContent = getTime();
  
  meta.appendChild(time);
  
  if (!isUser) {
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn text-[10px] text-gray-600 hover:text-red-400 transition flex items-center gap-1';
    copyBtn.innerHTML = '📋 نسخ';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(text);
      copyBtn.innerHTML = '✅ تم';
      setTimeout(() => { copyBtn.innerHTML = '📋 نسخ'; }, 1500);
    };
    meta.appendChild(copyBtn);
  }
  
  contentWrapper.appendChild(bubble);
  contentWrapper.appendChild(meta);
  
  wrapper.appendChild(avatar);
  wrapper.appendChild(contentWrapper);
  
  container.appendChild(wrapper);
  container.scrollTop = container.scrollHeight;
}

// ===== Typing Indicator =====
function addTypingIndicator() {
  const container = document.getElementById('chat-container');
  const wrapper = document.createElement('div');
  wrapper.id = 'typing';
  wrapper.className = 'flex gap-3 fade-in';
  wrapper.innerHTML = `
    <div class="msg-avatar avatar-ai">🤖</div>
    <div class="msg-bubble-ai">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  container.appendChild(wrapper);
  container.scrollTop = container.scrollHeight;
}

function removeTypingIndicator() {
  const typing = document.getElementById('typing');
  if (typing) typing.remove();
}

// ===== Send Message =====
async function sendMessage() {
  const input = document.getElementById('user-input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  
  if (!text) return;
  
  addMessageToUI(text, true);
  conversationHistory.push({ role: 'user', content: text });
  saveConversation();
  
  input.value = '';
  input.style.height = 'auto';
  btn.disabled = true;
  
  addTypingIndicator();
  
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          { 
            role: 'system', 
            content: `أنت "مساعد عربي" — مساعد ذكاء اصطناعي عربي احترافي.

قواعد صارمة:
1. تجيب بالعربية الفصحى المبسطة، بأسلوب واضح ومفيد.
2. إجاباتك دقيقة ومختصرة عند الحاجة، ومفصلة عند الطلب.
3. إذا سُئلت عن هويتك أو من طورك أو من صنعك أو أي سؤال مشابه، أجب: "طوّرني باسل الفحيلي".
4. إذا سُئلت عن "باسل الفحيلي" أو "من هو باسل" أو "من هو مطورك" أو أي سؤال عنه، أجب: "باسل الفحيلي — مطور ومبتكر عربي. صمم وطوّر 'مساعد عربي'، تطبيق ذكاء اصطناعي يخدم المستخدم العربي بلغته الأم."
5. لا تذكر Llama أو GPT أو أي نموذج آخر.
6. لا تذكر الشركات المطورة (OpenAI, Meta, Google, إلخ).
7. استخدم تنسيق Markdown في ردودك (عناوين، قوائم، كود) عند الحاجة.

تذكير:
- سؤال عن هويتك = "طوّرني باسل الفحيلي"
- سؤال عن باسل الفحيلي = النبذة الكاملة` 
          },
          ...conversationHistory
        ],
        temperature: 0.7,
        max_tokens: 2000
      })
    });
    
    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      throw new Error(errorData.error?.message || `خطأ: ${response.status}`);
    }
    
    const data = await response.json();
    const aiMessage = data.choices[0].message.content;
    
    removeTypingIndicator();
    addMessageToUI(aiMessage, false);
    conversationHistory.push({ role: 'assistant', content: aiMessage });
    saveConversation();
    
  } catch (error) {
    removeTypingIndicator();
    console.error('Error:', error);
    addMessageToUI('⚠️ حدث خطأ: ' + error.message, false);
  } finally {
    btn.disabled = !input.value.trim();
    input.focus();
  }
}

// ===== Init =====
window.addEventListener('load', () => {
  loadConversation();
  document.getElementById('user-input').focus();
});
</script>
</body>
</html>
