<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد عربي — AI بدون تعقيد</title>
<meta name="description" content="مساعد ذكاء اصطناعي عربي. اكتب، اسأل، واحصل على إجابة فورية.">
<meta property="og:title" content="مساعد عربي">
<meta property="og:description" content="AI بالعربية، بدون تعقيد">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Cairo', sans-serif; }
  .glass-panel { background: rgba(17,24,39,0.75); backdrop-filter: blur(12px); border: 1px solid rgba(55,65,81,0.5); }
  
  .message-user {
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    color: white;
    border-radius: 18px 18px 4px 18px;
    padding: 12px 16px;
    max-width: 85%;
    margin-left: auto;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: fadeInUp 0.3s ease-out;
  }
  
  .message-ai {
    background: #1f2937;
    border: 1px solid #374151;
    color: #e5e7eb;
    border-radius: 18px 18px 18px 4px;
    padding: 12px 16px;
    max-width: 85%;
    margin-right: auto;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: fadeInUp 0.3s ease-out;
    line-height: 1.7;
  }
  
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .typing-indicator span {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #9ca3af;
    margin: 0 2px;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
  
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #111827; }
  ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  
  textarea {
    resize: none;
    max-height: 120px;
  }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

<header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
  <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🤖</span>
      <div>
        <h1 class="text-lg font-bold text-white">مساعد عربي</h1>
        <p class="text-xs text-gray-400">AI بالعربية، بدون تعقيد</p>
      </div>
    </div>
    <button onclick="clearChat()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg transition">
      محادثة جديدة
    </button>
  </div>
</header>

<main class="flex-grow overflow-hidden">
  <div class="max-w-3xl mx-auto h-full flex flex-col px-4">
    
    <div id="chat-container" class="flex-grow overflow-y-auto py-6 space-y-4">
      <div id="welcome" class="text-center py-12">
        <div class="text-5xl mb-4">👋</div>
        <h2 class="text-xl font-bold text-white mb-2">مرحباً بك</h2>
        <p class="text-gray-400 text-sm mb-6">اكتب أي سؤال، أو جرّب أحد الأمثلة:</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-lg mx-auto">
          <button onclick="useSuggestion('اكتب لي رسالة شكر لمديري')" class="glass-panel rounded-xl p-3 text-right hover:border-red-500 transition text-sm text-gray-300">
            ✍️ اكتب رسالة شكر
          </button>
          <button onclick="useSuggestion('اشرح لي نظرية النسبية بأسلوب بسيط')" class="glass-panel rounded-xl p-3 text-right hover:border-red-500 transition text-sm text-gray-300">
            🧠 اشرح لي مفهوماً
          </button>
          <button onclick="useSuggestion('لخص لي هذا النص: ') " class="glass-panel rounded-xl p-3 text-right hover:border-red-500 transition text-sm text-gray-300">
            📝 لخص نصاً
          </button>
          <button onclick="useSuggestion('صحح الأخطاء الإملائية في هذا النص: ') " class="glass-panel rounded-xl p-3 text-right hover:border-red-500 transition text-sm text-gray-300">
            ✏️ صحح نصاً
          </button>
        </div>
      </div>
    </div>

    <div class="py-4 border-t border-gray-800">
      <div class="flex items-end gap-2 bg-gray-900 border border-gray-800 rounded-2xl p-2">
        <textarea 
          id="user-input" 
          rows="1"
          placeholder="اكتب رسالتك هنا..." 
          class="flex-grow bg-transparent text-white text-sm p-2 focus:outline-none placeholder-gray-500"
          onkeydown="handleKeyDown(event)"
          oninput="autoResize(this)"></textarea>
        <button 
          id="send-btn"
          onclick="sendMessage()" 
          class="bg-red-600 hover:bg-red-500 disabled:bg-gray-700 disabled:cursor-not-allowed text-white rounded-xl p-2.5 transition flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <p class="text-xs text-gray-500 text-center mt-2">مدعوم بـ Groq • Llama 3.3 70B</p>
    </div>
  </div>
</main>

<script>
const WORKER_URL = 'https://worker-abc123.mysfhyly.workers.dev';
const MODEL = 'llama-3.3-70b-versatile';

let conversationHistory = [];

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
}

function handleKeyDown(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function useSuggestion(text) {
  document.getElementById('user-input').value = text;
  document.getElementById('user-input').focus();
  autoResize(document.getElementById('user-input'));
}

function clearChat() {
  if (confirm('هل تريد بدء محادثة جديدة؟ سيتم حذف المحادثة الحالية.')) {
    conversationHistory = [];
    const container = document.getElementById('chat-container');
    container.innerHTML = `
      <div id="welcome" class="text-center py-12">
        <div class="text-5xl mb-4">👋</div>
        <h2 class="text-xl font-bold text-white mb-2">مرحباً بك</h2>
        <p class="text-gray-400 text-sm mb-6">اكتب أي سؤال، أو جرّب أحد الأمثلة:</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-lg mx-auto">
          <button onclick="useSuggestion('اكتب لي رسالة شكر لمديري')" class="glass-panel rounded-xl p-3 text-right hover:border-red-500 transition text-sm text-gray-300">✍️ اكتب رسالة شكر</button>
          <button onclick="useSuggestion('اشرح لي نظرية النسبية بأسلوب بسيط')" class="glass-panel rounded-xl p-3 text-right hover:border-red-500 transition text-sm text-gray-300">🧠 اشرح لي مفهوماً</button>
          <button onclick="useSuggestion('لخص لي هذا النص: ') " class="glass-panel rounded-xl p-3 text-right hover:border-red-500 transition text-sm text-gray-300">📝 لخص نصاً</button>
          <button onclick="useSuggestion('صحح الأخطاء الإملائية في هذا النص: ') " class="glass-panel rounded-xl p-3 text-right hover:border-red-500 transition text-sm text-gray-300">✏️ صحح نصاً</button>
        </div>
      </div>
    `;
  }
}

function addMessage(text, isUser) {
  const container = document.getElementById('chat-container');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  
  const div = document.createElement('div');
  div.className = isUser ? 'message-user' : 'message-ai';
  div.innerText = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addTypingIndicator() {
  const container = document.getElementById('chat-container');
  const div = document.createElement('div');
  div.id = 'typing';
  div.className = 'message-ai flex items-center gap-2';
  div.innerHTML = '<div class="typing-indicator flex"><span></span><span></span><span></span></div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeTypingIndicator() {
  const typing = document.getElementById('typing');
  if (typing) typing.remove();
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  
  if (!text) return;
  
  addMessage(text, true);
  conversationHistory.push({ role: 'user', content: text });
  
  input.value = '';
  input.style.height = 'auto';
  btn.disabled = true;
  
  addTypingIndicator();
  
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          { 
            role: 'system', 
            content: 'أنت مساعد عربي ذكي ومفيد. تجيب بالعربية الفصحى المبسطة. إجاباتك واضحة ومفيدة ومختصرة عند الحاجة.' 
          },
          ...conversationHistory
        ],
        temperature: 0.7,
        max_tokens: 2000
      })
    });
    
    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      throw new Error(errorData.error?.message || `خطأ: ${response.status}`);
    }
    
    const data = await response.json();
    const aiMessage = data.choices[0].message.content;
    
    removeTypingIndicator();
    addMessage(aiMessage, false);
    conversationHistory.push({ role: 'assistant', content: aiMessage });
    
  } catch (error) {
    removeTypingIndicator();
    console.error('Error:', error);
    addMessage('⚠️ حدث خطأ: ' + error.message, false);
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

window.addEventListener('load', () => {
  document.getElementById('user-input').focus();
});
</script>
</body>
</html>
